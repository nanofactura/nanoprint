# cargo-deny: dependency licenses, security advisories and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# The platforms NanoPrint ships on, as in about.toml: dependencies of other targets (Android, iOS)
# never reach a NanoPrint binary.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable. It is a compile-time macro of the GTK 0.18 bindings that Tauri uses on Linux; no upgrade exists until Tauri moves to newer gtk-rs." },
  # zip 4 is only reachable through tauri-plugin-updater, which extracts an update archive after
  # verifying its signature with our update key: an attacker cannot hand it a crafted archive. The
  # fix needs zip 9, which no stable updater release uses yet.
  { id = "RUSTSEC-2026-0367", reason = "zip extraction flaw; zip only extracts signature-verified updates. No updater release on zip >= 9 yet." },
  { id = "RUSTSEC-2026-0368", reason = "zip extraction flaw; zip only extracts signature-verified updates. No updater release on zip >= 9 yet." },
  { id = "RUSTSEC-2026-0369", reason = "zip extraction flaw; zip only extracts signature-verified updates. No updater release on zip >= 9 yet." },
  # zbus 5 crates, merged into zbus 6. They come through keyring and single-instance on Linux.
  { id = "RUSTSEC-2026-0370", reason = "Unmaintained, not vulnerable; part of zbus 5, which our dependencies have not left yet." },
  { id = "RUSTSEC-2026-0371", reason = "Unmaintained, not vulnerable; part of zbus 5, which our dependencies have not left yet." },
  { id = "RUSTSEC-2026-0372", reason = "Unmaintained, not vulnerable; part of zbus 5, which our dependencies have not left yet." },
]

[licenses]
# Every entry must be compatible with GPL-3.0-only, NanoPrint's license.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates (all `publish = false`) carry no version.
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
