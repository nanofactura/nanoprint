[workspace]
members = ["crates/protocol", "src-tauri"]
# Fuzz targets build with cargo-fuzz (nightly) in their own workspace.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
# The single source of the NanoPrint version (SemVer). Tauri, the installers, the updater and the
# UI read it from here. MSI installers only accept numeric pre-release identifiers (`1.2.0-1`).
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/nanofactura/nanoprint"

[workspace.lints.rust]
# FFI modules opt in locally with `#[allow(unsafe_code)]` and a `// SAFETY:` comment per block.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
# Pedantic lints that add noise without value in an application.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Small binary and memory footprint. See https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Panics unwind (the default, not "abort"): a bug reached through untrusted input, such as a site's
# logo, ends that task instead of the whole agent.
