# Coverage-guided fuzzing of what web pages send (cargo-fuzz, nightly Rust):
#   mkdir -p fuzz/corpus/parse && cp fuzz/seeds/parse/* fuzz/corpus/parse/
#   cargo +nightly fuzz run parse
[package]
name = "nanoprint-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nanoprint-protocol = { path = "../crates/protocol" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Not part of the main workspace (see the root Cargo.toml).
[workspace]
