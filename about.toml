# cargo-about: third-party license notices for the release builds (`npm run notices`).
# Accept the same licenses as deny.toml.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# Only what ends up in the executable, for every platform NanoPrint ships on.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# NanoPrint itself (`publish = false`, GPL-3.0-only) is not a third party.
private = { ignore = true }
