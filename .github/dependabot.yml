version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the ecosystem a week to catch compromised releases before we adopt them.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Follows the Node.js major version in .nvmrc, and changes together with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
