version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the ecosystem a week to catch compromised releases before we adopt them.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Follows the Node.js major version in .nvmrc, and changes together with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # svelte-check does not accept TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The website (landing/) has its own package and lock file.
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      landing:
        patterns: ['*']
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # Does not build on Linux; see the pin in src-tauri/Cargo.toml.
      - dependency-name: tauri-plugin-deep-link
        versions: ['2.6.2']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Every step of a workflow must run the same codeql-action version.
      actions:
        patterns: ['*']
