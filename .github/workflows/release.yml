# Builds the installers when a version tag is pushed and attaches them to a draft GitHub release.
# Assets keep version-less names, so releases/latest/download/<name> always serves the newest one.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Holds the signing secrets once they exist, and can require a maintainer's approval.
    environment: release
    permissions:
      contents: write # create the draft release and upload the installers
      id-token: write # sign the build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu, so the packages run on more distributions.
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # rustup comes with the runners: no third-party action needed (see rust-toolchain.toml).
      - name: Install Rust
        shell: bash
        env:
          TARGETS: ${{ matrix.rust-targets }}
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt ${TARGETS:+--target "$TARGETS"}
      # No build caches here: a release is built from scratch, so nothing cached by another
      # workflow can end up in an installer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2
      - run: npm ci
      # The licenses window of the release build.
      - run: npm run notices
      # The same self-signed identity on every version keeps macOS from asking again for NanoPrint's
      # Keychain item after an update (scripts/macos-signing-certificate.sh, docs/releasing.md).
      # Without the secret the app keeps its ad-hoc signature.
      - name: Import the macOS signing identity
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret: the app gets an ad-hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is trusted for code signing on this throwaway runner only.
          security find-certificate -c "NanoPrint Code Signing" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem" \
            || echo "::warning::Could not mark the signing certificate as trusted; codesign decides."
          echo "APPLE_SIGNING_IDENTITY=NanoPrint Code Signing" >> "$GITHUB_ENV"
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and latest.json; NanoPrint installs only updates signed with
          # this key (docs/releasing.md). Without these secrets the build fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NanoPrint ${{ github.ref_name }}
          # The download page of each release; SignPath requires the code signing policy on it.
          releaseBody: |
            Download the installer for your system below. Installation steps for each system:
            https://nanoprint.nanofactura.com/en/#download (en español: https://nanoprint.nanofactura.com/#download).

            What changed: [CHANGELOG.md](https://github.com/nanofactura/nanoprint/blob/main/CHANGELOG.md).

            Verify a download: `gh attestation verify <file> --repo nanofactura/nanoprint`

            **Code signing policy:** Windows releases are going to be signed through the SignPath Foundation program for open-source projects; until it accepts NanoPrint, installers are not signed. Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Roles and privacy: [code signing policy](https://github.com/nanofactura/nanoprint#code-signing-policy).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseAssetNamePattern: '[name]_[arch][setup][ext]'
          args: ${{ matrix.args }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}

  sbom:
    name: Software bill of materials
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # attach the SBOM to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: nanoprint.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" nanoprint.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
