name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        NanoPrint delivers print jobs; invoicing, tax rules and receipt templates belong to the
        applications that use it (see the scope in CLAUDE.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
